name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Tonic and the proto crate compile through protoc; pin via apt below.

jobs:
  rust-check:
    name: rust check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-check

      # Formatting is enforced tree-wide now that the one-shot reformat has
      # landed. Runs before the heavier check so style drift fails fast/cheap.
      # (Unlike the build, fmt does not compile, so neuromorphic is not excluded.)
      - name: cargo fmt --check
        run: cargo fmt --all --check

      # `--all-targets` exercises lib + bin + tests + examples + benches
      # so rot in any of them shows up at PR time instead of when someone
      # actually runs `cargo bench` or builds an example.
      #
      # `jflow-neuromorphic` (~251K LOC) is excluded: it is an experimental
      # subsystem that no service depends on, so compiling it on every PR is
      # pure cost. It remains a workspace member, buildable on demand with
      # `cargo check -p jflow-neuromorphic`. See docs/architecture/ML_STORY.md.
      - name: cargo check --workspace
        run: cargo check --workspace --all-targets --exclude jflow-neuromorphic

  rust-test:
    name: rust test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: rust-check
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-test

      # `--lib` skips integration / e2e suites that need a live Postgres
      # or Redis. Those run separately if/when we wire up service-backed CI.
      # `jflow-neuromorphic` is excluded for the same reason as in rust-check.
      - name: cargo test --workspace --lib
        run: cargo test --workspace --lib --no-fail-fast --exclude jflow-neuromorphic

  docker-build:
    name: docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: rust-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Verifies the Dockerfile still builds end-to-end on PRs without
      # pushing anything to dockerhub. The publish workflow rebuilds with
      # the same Buildx cache key.
      - name: Build janus image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: fks-janus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
