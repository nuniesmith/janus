name: Publish image to Docker Hub

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to push (e.g. `release-candidate`). Optional."
        required: false
        default: ""

concurrency:
  # Allow only one publish at a time per ref so we never race two writes
  # to the same dockerhub tag.
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build & push janus
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify DOCKERHUB_* secrets are configured
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repo secrets must be set."
            exit 1
          fi
          echo "Docker Hub user: ${DOCKERHUB_USERNAME}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # The image lives under whichever account owns the secrets, so the
          # repo name is parameterised. Override via `DOCKERHUB_IMAGE` repo
          # variable if you ever publish under a different name than
          # `<user>/janus`.
          images: ${{ vars.DOCKERHUB_IMAGE || format('{0}/janus', secrets.DOCKERHUB_USERNAME) }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=main-,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=fks-janus
            org.opencontainers.image.description=Rust ML inference engine and neuromorphic trading brain.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # linux/amd64 only by default — flip to `linux/amd64,linux/arm64`
          # once we're ready to eat ~2x build time for cross-arch images.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Share the cache with the PR-side `docker build` job so reruns
          # are warm.
          cache-from: type=gha
          cache-to: type=gha,mode=max
