[package]
publish = false  # app/vendored: not published to crates.io
name = "janus-forward"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "janus-forward"
path = "src/main.rs"

[[bin]]
name = "regime-bridge-consumer"
path = "src/regime_bridge_consumer.rs"

[[test]]
name = "param_reload_integration"
path = "tests/param_reload_integration.rs"

[[test]]
name = "regime_mr_integration"
path = "tests/regime_mr_integration.rs"

[[test]]
name = "regime_bridge_integration"
path = "tests/regime_bridge_integration.rs"

[[test]]
name = "regime_bridge_auth_integration"
path = "tests/regime_bridge_auth_integration.rs"

[[test]]
name = "brain_wiring_integration"
path = "tests/brain_wiring_integration.rs"

[[test]]
name = "brain_runtime_integration"
path = "tests/brain_runtime_integration.rs"

[[test]]
name = "brain_gated_e2e"
path = "tests/brain_gated_e2e.rs"

[[test]]
name = "staging_validation"
path = "tests/staging_validation.rs"

[dependencies]
# Unified JANUS core
janus-core = { workspace = true }

# Centralized proto definitions
fks-proto = { workspace = true }

# Workspace crates
common = { path = "../../crates/common", package = "jflow-common" }
janus-indicators = { workspace = true }
janus-strategies = { path = "../../crates/strategies", package = "jflow-strategies" }
janus-regime = { path = "../../crates/regime", package = "jflow-regime" }
janus-models = { path = "../../crates/models", package = "jflow-models" }
janus-health = { path = "../../crates/health", package = "jflow-health" }
janus-risk = { path = "../../crates/risk", package = "jflow-risk" }
janus-execution-gate = { path = "../../crates/execution-gate", package = "jflow-execution-gate" }
janus-cns = { path = "../../crates/cns", package = "jflow-cns" }
# Bybit connectivity now comes from the published exchange-apiws crate; the
# `bybit_compat` module adapts it to the API the event loop expects.
exchange-apiws = { version = "0.7", default-features = false, features = ["bybit"] }
janus-questdb-writer = { path = "../../crates/questdb-writer", package = "jflow-questdb-writer" }

# Async Runtime
tokio = { workspace = true }
tokio-stream = { version = "0.1.17", features = ["sync", "net"] }
futures-util = { workspace = true }
futures = "0.3.31"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Experience pipeline spool (Arrow IPC batches — see src/experience.rs)
arrow = { workspace = true }

# HTTP & Network
axum = { workspace = true }
reqwest = { workspace = true }
tower-http = { version = "0.6.8", features = ["trace"] }

# Time & Date
chrono = { workspace = true }

# Logging & Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error Handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Configuration
config = { workspace = true }
toml = { workspace = true }

# Metrics
prometheus = { workspace = true }

# gRPC
tonic = { workspace = true }
tonic-reflection = "0.14.2"
tonic-prost = "0.14.2"
prost = { workspace = true }
prost-types = { workspace = true }

# ML/AI — Burn inference. Loads the LstmPredictor checkpoints the backward
# trainer writes (replaces the former tract-onnx path, which couldn't read them).
janus-ml = { path = "../../crates/ml", package = "jflow-ml" }

# Vector DB
qdrant-client = { workspace = true }

# Utilities
uuid = { workspace = true }
rayon = { workspace = true }

# Numeric types (for market data Decimal → f64 conversion)
rust_decimal = { version = "1.39.0", features = ["serde-float"] }

# Database (for signal caching, minimal use)
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"], optional = true }

# WebSocket — rustls TLS so wss:// connects (see workspace Cargo.toml note)
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
async-trait = { workspace = true }

# Redis (for real-time state)
redis = { workspace = true }

[dev-dependencies]
tokio-test = "0.4.4"
tempfile = "3.13"
# End-to-end experience-pipeline test: this producer against the real
# backward consumer (tests/experience_pipeline.rs).
janus-backward = { path = "../backward" }
uuid = { workspace = true }
futures = { workspace = true }
tokio-stream = { version = "0.1.17", features = ["net"] }
chrono = { workspace = true }
janus-cns = { path = "../../crates/cns", package = "jflow-cns" }
janus-optimizer = { path = "../../crates/optimizer", package = "jflow-optimizer" }

[features]
default = ["redis", "persistence"]
persistence = ["sqlx"]
redis = []
tls = ["tonic/tls-ring"]
