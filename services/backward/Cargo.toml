[package]
publish = false  # app/vendored: not published to crates.io
name = "janus-backward"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "janus-backward"
path = "src/main.rs"

# Committed, re-runnable Gate-A janus-side verdict script
# (GATE_A_PREREGISTRATION.md §4a; statistics live in src/verdict.rs).
[[bin]]
name = "gate_a_verdict"
path = "src/bin/gate_a_verdict.rs"

[dependencies]
# Unified JANUS core
janus-core = { workspace = true }

# Core crates
common = { path = "../../crates/common", package = "jflow-common" }
memory = { path = "../../crates/memory", package = "jflow-memory" }
fks-proto = { workspace = true }
cns = { package = "jflow-cns", path = "../../crates/cns" }
janus-models = { path = "../../crates/models", package = "jflow-models" }
janus-health = { path = "../../crates/health", package = "jflow-health" }
janus-ml = { path = "../../crates/ml", package = "jflow-ml" }
# Vision (DiffGAF) for real GAF training features (ML Phase 1)
janus-vision = { path = "../../crates/vision", package = "jflow-vision" }
candle-core = { workspace = true }

# Job Queue
apalis = { workspace = true }
apalis-redis = { workspace = true }
redis = { workspace = true }

# Runtime
tokio = { workspace = true, features = ["full"] }
tokio-util = "0.7"

# HTTP server for health/metrics
axum = { workspace = true }
tower-http = { version = "0.6.8", features = ["trace"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
arrow = { workspace = true }
arrow-ipc = { workspace = true }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Configuration
config = { workspace = true }
toml = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Vector DB
qdrant-client = { workspace = true }

# Utilities
chrono = { workspace = true }
uuid = { workspace = true }

# Database - PRIMARY for backward service
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }

# Metrics
prometheus = { workspace = true }

# Analytics
rayon = { workspace = true }

[dev-dependencies]
tokio-test = "0.4.4"
tempfile = "3.13"

[features]
default = []
