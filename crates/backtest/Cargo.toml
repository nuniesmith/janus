[package]
name = "jflow-backtest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Zero-lookahead backtesting engine for JANUS trading strategies."
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "janus_backtest"

[dependencies]
# Core crates
janus-models = { path = "../models", package = "jflow-models", version = "0.1.0" }
janus-indicators = { workspace = true }
janus-strategies = { path = "../strategies", package = "jflow-strategies", version = "0.1.0" }
janus-risk = { path = "../risk", package = "jflow-risk", version = "0.1.0" }
janus-regime = { path = "../regime", package = "jflow-regime", version = "0.1.0" }

# Data processing
polars = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
approx = "0.5"
tempfile = "3.8"
