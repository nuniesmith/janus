[package]
name = "jflow-backtest"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "janus_backtest"

[dependencies]
# Core crates
janus-models = { path = "../models", package = "jflow-models" }
janus-indicators = { path = "../indicators", package = "jflow-indicators" }
janus-strategies = { path = "../strategies", package = "jflow-strategies" }
janus-risk = { path = "../risk", package = "jflow-risk" }
janus-compliance = { path = "../compliance", package = "jflow-compliance" }
janus-regime = { path = "../regime", package = "jflow-regime" }

# Data processing
polars = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
approx = "0.5"
tempfile = "3.8"
