[package]
name = "jflow-exchanges"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Janus ingestion support: CNS metrics, exchange health monitoring, and price normalization. (Exchange connectivity now lives in the published exchange-apiws crate.)"
authors.workspace = true
license.workspace = true

[lib]
name = "janus_exchanges"

[dependencies]
# Janus internal
janus-core = { path = "../../lib/janus-core", package = "jflow-core", version = "0.1.0" }
janus-cns = { path = "../cns", optional = true, package = "jflow-cns", version = "0.1.0" }

# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
async-trait.workspace = true

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# HTTP client
reqwest = { workspace = true, features = ["json"] }

# Data types
rust_decimal = { workspace = true, features = ["serde-float"] }
chrono.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true

# Utilities
url.workspace = true

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
# CNS metrics reporting (pulls in jflow-cns). The per-exchange features were
# removed along with the in-house adapters — exchange selection now happens in
# the consumer via exchange-apiws's own features.
cns-metrics = ["janus-cns"]
